services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_pass
      POSTGRES_DB: geyam
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_user -d geyam"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@geyam.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "9000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://pos_user:pos_pass@db:5432/geyam
      ALEMBIC_DATABASE_URL: postgresql+psycopg://pos_user:pos_pass@db:5432/geyam
      REDIS_URL: redis://redis:6379/0
      MODEL_DIR: /app/ml_models
      TRAINING_DATA_DIR: /app/training_data
      UPLOADS_DIR: /app/uploads
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - ./backend:/app
      - ./backend/ml_models:/app/ml_models
      - ./backend/training_data:/app/training_data
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build: ./backend
    command: rq worker --url redis://redis:6379/0 geyam
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://pos_user:pos_pass@db:5432/geyam
      REDIS_URL: redis://redis:6379/0
      MODEL_DIR: /app/ml_models
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./backend:/app
      - ./backend/ml_models:/app/ml_models
      - ./backend/training_data:/app/training_data
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  scheduler:
    build: ./backend
    command: python -m app.services.autovoid_worker
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://pos_user:pos_pass@db:5432/geyam
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh","-c"]
    command: >
      "while true; do
         pg_dump -h db -U pos_user geyam | gzip > /backups/geyam_$$(date +%Y%m%d_%H%M).sql.gz;
         find /backups -name 'geyam_*.sql.gz' -mtime +7 -delete;
         sleep 86400;
       done"
    environment:
      PGPASSWORD: pos_pass
    volumes:
      - ./backend/backups:/backups
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin_data:
