name: geyam_pos
description: GEYAM Smart POS — Flutter frontend (mobile + web)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  mime: ^2.0.0
  provider: ^6.1.2
  image_picker: ^1.1.2
  camera: ^0.11.0
  fl_chart: ^0.69.0
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.0.5
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.2
  video_player: ^2.9.2
  shared_preferences: ^2.3.0
  go_router: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/demo.mp4
    - assets/images/google_logo.png
