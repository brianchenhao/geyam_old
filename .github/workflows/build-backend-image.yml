name: Build + push backend image to GHCR

on:
  push:
    branches:
      - main
      - 'stage-3-phase-*'
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend-image.yml'
  workflow_dispatch:

# GITHUB_TOKEN needs packages:write to push to ghcr.io.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # Multi-arch would double build time without buying us anything —
          # the VPS is amd64. Pin to that.
          platforms: linux/amd64
          tags: |
            ghcr.io/brianchenhao/geyam-backend:${{ github.sha }}
            ghcr.io/brianchenhao/geyam-backend:latest
          # Cache layers in GHA cache to skip the slow pip install when
          # only application code changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
