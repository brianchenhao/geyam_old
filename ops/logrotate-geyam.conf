# Logrotate config for host-side geyam logs.
#
# Installed to /etc/logrotate.d/geyam by ops/install-logrotate.sh.
# Docker container logs (db, redis, backend, caddy) are bounded separately via
# the `logging` x-anchor in ops/docker-compose.yml — they do NOT need entries
# here. This file covers only logs written directly on the host filesystem.

# Nightly backup runner (Phase 3 cron, /opt/geyam/ops/backup.sh)
/var/log/geyam-backup.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
